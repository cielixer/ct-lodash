name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          
      - name: Configure
        run: pixi run configure
        
      - name: Build
        run: pixi run build
        
      - name: Test
        run: pixi run test
        
      - name: Install Check
        run: pixi run install-check
        
      - name: Lint
        run: pixi run lint
        
      - name: Namespace Check
        run: pixi run namespace-check
        
      - name: Public API Check
        run: pixi run public-api-check

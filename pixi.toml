[workspace]
name = "ctl"
version = "0.1.0"
description = "Lodash for C++ structs: header-only C++23 functional utilities"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]

[dependencies]
cmake = ">=3.25"
ninja = ">=1.11"
cxx-compiler = "*"
catch2 = ">=3.0"
boost-cpp = "*"
nlohmann_json = ">=3.11"
clang-format = "*"

[tasks]
configure = "cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release"
build = "cmake --build build"
test = "ctest --test-dir build --output-on-failure"
example = "cmake --build build --target compile_time_quickstart runtime_escape_hatch && ./build/examples/compile_time_quickstart && ./build/examples/runtime_escape_hatch"
clean = "rm -rf build"
install-check = """
  rm -rf build/install_prefix build/consumer_install &&
  cmake --install build --prefix build/install_prefix &&
  cmake -S tests/consumer -B build/consumer_install -G Ninja \
    -DCMAKE_PREFIX_PATH=$PWD/build/install_prefix \
    -DCMAKE_CXX_COMPILER=$(which c++) &&
  cmake --build build/consumer_install &&
  build/consumer_install/consumer_test
"""
lint = "clang-format --dry-run -Werror include/ctl/*.hpp include/ctl/detail/*.hpp tests/*.cpp examples/*.cpp 2>&1 || (echo '❌ Run: clang-format -i <files>' && exit 1)"
namespace-check = "bash scripts/check_namespace.sh"
public-api-check = "bash scripts/check_public_api.sh"
